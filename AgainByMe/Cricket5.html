<!DOCTYPE html>
<html lang="en">
<head>
    <title>Cricket By Devloper</title>
    <style>
        body{
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Bat Ball Stump Game</h1>

    <button onclick="
    let computerChoice =generateComputerChoice();
    let resultMsg = getResult('Bat', computerChoice);
    showResult('Bat',computerChoice,resultMsg);
    " >Bat</button>

    <button  onclick="
    let computerChoice=generateComputerChoice();
    let resultMsg =getResult('Ball',computerChoice);
    showResult('Ball',computerChoice,resultMsg);
    "  >Ball</button>

    <button  onclick="
    let computerChoice =generateComputerChoice();
    let resultMsg = getResult('Stump', computerChoice);
    
    showResult('Stump',computerChoice,resultMsg);
    ">Stump</button>

    <button onclick="localStorage.clear()
        resetScore(scoreStr);" >Reset</button>

    <script>
        let score;
        let scoreStr =localStorage.getItem('Score');
        resetScore(scoreStr);
        function resetScore(scoreStr) {

        score = JSON.parse(scoreStr) || {
            win: 0,
            lost: 0,
            tie: 0,
        };
    //     if (scoreStr !== undefined) {
    //         score = JSON.parse(scoreStr);
    //     }else{
    //     score = {
    //         win:0,
    //         lost:0,
    //         tie:0,
            
    //     };
    // }
        score.displayScore =function(){
                return `Number of mathces Won:${score.win},Lost:${score.lost}, Tie:${score.tie}`;};
            }

        function generateComputerChoice() {
            let randomNumber = Math.random()*3;
            if (randomNumber > 0 && randomNumber <=1) {
                return 'Bat';
            }else if (randomNumber>1 && randomNumber<=2) {
                return 'Ball';
            }else{
                return'Stump';
            }
            // return computerChoice;
        }

        function getResult(userMove, computerMove) {

            if (userMove === 'Bat') {
               if (computerMove === 'Ball') {
                 score.win++;
                  return 'User won.';
               }else if (computerMove === 'Bat') {
                 score.tie++;
                  return`It's a tie.`;
               }else if(computerMove === 'Stump'){
                 score.lost++;
                  return'Compurt has won.'
               }
            }else if(userMove === 'Ball'){
                if (computerMove === 'Ball') {
                 score.tie++;
                   return`It's a tie`;
                }else if (computerMove === 'Bat') {
                 score.lost++;
                   return'Computer has won';
                }else if(computerMove === 'Stump'){
                 score.win++;
                   return'User won.';
                }

            }else{
              if (computerMove === 'Ball') {
                 score.lost++;
                  return'computer has won';
              }else if (computerMove === 'Bat') {
                 score.win++;
                  return'User won';
              }else if(computerMove === 'Stump'){
                 score.tie++;
                  return`It's ties `;
              }

            }
        }

        function showResult(userMove,computerMove,result){
            localStorage.setItem('Score',JSON.stringify(score));

           alert (`You have chosen ${userMove}. Computer choice is  ${computerMove} 
           ${result} 
           ${score.displayScore()}`);
        }


    </script>


</body>
</html>
