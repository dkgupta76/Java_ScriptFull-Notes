<!DOCTYPE html>
<html lang="en">
<head>
    <title>Practice Exercise </title>
</head>
<body>
    <script>
        function isOdd(number) {
            let rem = number%2 ;
            let isOdd=rem ==1;
            return isOdd;
        }

        console.log(isOdd(5));
        console.log(isOdd(205));
        console.log(isOdd(52));


        function larger(num1,num2) {
            if (num1>num2) {
                return num1;
            }else{
                return num2;
            }
        }

        console.log(larger(5,41));
        console.log(larger(50,41));
        console.log(larger(55,41));
        console.log(larger(500,41000));

        function toFahrenheit(celsiusValue) {
            return 9/5*celsiusValue+32;
        }

        console.log(toFahrenheit(37));
        console.log(toFahrenheit(100));
        console.log(toFahrenheit(0));
        console.log(toFahrenheit(370));


    </script>
</body>
</html>
