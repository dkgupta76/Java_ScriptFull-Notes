<!DOCTYPE html>
<html lang="en">
<head>
    <title>CricketGame</title>
    <style>
        body{
            text-align: center;
        }
    </style>
</head>
<body>
    <h1> Baat Ball Stump Game</h1>

    <button onclick="
    let computerChoice = generateComputerChoice();
    let resultMsg = getResult('Bat',computerChoice);
        showResult('Bat', computerChoice,resultMsg);
    ">Bat</button>

    <button onclick="
     computerChoice =generateComputerChoice();
     resultMsg=getResult('Ball', computerChoice);
      showResult('Ball', computerChoice,resultMsg);
    ">Ball</button>

    <button onclick="
    computerChoice=generateComputerChoice();
    resultMsg = getResult('Stump',computerChoice);
      showResult('Stump',computerChoice,resultMsg);
     ">Stump</button>

    <script>
        function generateComputerChoice(){
            let randomNumber = Math.random()*3;
            if(randomNumber>0 && randomNumber<=1){
                return 'Bat';
            }else if (randomNumber>1 && randomNumber<=2){
                return'Ball';

            }else{
                return'Stump';
            }
        }
        function getResult(userMove, computerMove) {
    if (userMove === 'Bat') {
        if (computerMove === 'Ball')       return 'User won.';
        else if (computerMove === 'Bat')   return "It's a tie";
        else if (computerMove === 'Stump') return 'Computer has won';
    } else if (userMove === 'Ball') {
        if (computerMove === 'Ball')       return "It's a tie.";
        else if (computerMove === 'Bat')   return 'Computer has won';
        else if (computerMove === 'Stump') return 'User has won';
    } else {
        if (computerMove === 'Ball')       return 'Computer has Won.';
        else if (computerMove === 'Bat')   return 'User has Won';
        else if (computerMove === 'Stump') return "It's a tie";
    }
}

function showResult(userMove, computerMove, result) {
    alert(`You chose ${userMove}. Computer chose ${computerMove}. ${result}`);
}

    </script>
</body>
</html>
